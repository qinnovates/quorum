# quorum.toml: BYOAI configuration for the Quorum orchestrator.
# Copy to ~/.config/quorum/quorum.toml and edit. Project-level files are untrusted. Nothing here is required
# except the providers you use. Prices, the confidence floor and budgets have
# no defaults on purpose: fill them from current published rates and the eval.

[panel]
# Distinct model families that must answer for a run to count.
# Below this the run stops with FAILED_DIVERSITY. It never falls back to all-Claude.
min_families = 2

[limits]
token_budget = 200000      # per run, across all agents
max_agents = 8             # subagents spawned per run
max_depth = 2              # nesting depth of spawned agents
max_output_tokens = 2000   # per-agent output cap

[escalation]
# Verdict confidence below this escalates to the strongest model.
# Leave unset until the eval sets it. While unset, the confidence trigger is off.
# confidence_floor = 0.6

# Per-model prices, USD per million tokens. Look up current published rates.
# Models without a price are reported as unpriced; their cost is never guessed.
# [pricing."<model-id>"]
# input_per_mtok = 0.0
# output_per_mtok = 0.0

# Local open-source orchestrator / PM. Never judges.
[providers.pm]
type = "ollama"
model = "<your-ollama-model>"
base_url = "http://localhost:11434"
rank = 1
capabilities = ["json_schema"]

# Panelist via the gemini CLI. The prompt is sent over stdin.
[providers.gemini]
type = "gemini_cli"
model = "<gemini-model-id-to-confirm>"
command = ["gemini", "--approval-mode", "plan", "-p", "Follow the instructions in the input."]
rank = 5
capabilities = ["web", "json_schema"]

# Any OpenAI-compatible endpoint (BYOAI). Family is declared by you.
# [providers.byo]
# type = "openai_compatible"
# model = "<your-model>"
# base_url = "https://<your-endpoint>/v1"
# family = "other"
# api_key_cmd = ["security", "find-generic-password", "-s", "quorum/byo", "-w"]
# rank = 3
# capabilities = ["json_schema"]
