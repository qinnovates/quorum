[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quorum-orchestrator"
version = "7.5.0"
description = "Model-agnostic orchestration for Quorum decision panels"
requires-python = ">=3.11"
dependencies = []
license = { text = "MIT" }

[project.scripts]
quorum-run = "orchestrator.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["orchestrator"]
py-modules = ["quorum_scorer"]
